<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>demo mind sucker shit</title>
  <!-- D3.js for Force-Directed Graph Rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <!-- PDF.js for Client-Side PDF Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: #151c2c;
      --bg-panel: #1e293b;
      --border-color: #334155;
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header Bar */
    header {
      height: 60px;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 10;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: lowercase;
    }

    .api-config {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .api-config input {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 240px;
      outline: none;
    }

    .api-config input:focus {
      border-color: var(--accent-blue);
    }

    /* Main Container */
    .app-container {
      flex: 1;
      display: flex;
      position: relative;
    }

    /* Graph Canvas */
    #graph-container {
      flex: 1;
      height: 100%;
      position: relative;
      background-radial: radial-gradient(#1e293b 1px, transparent 1px);
      background-size: 24px 24px;
    }

    svg {
      width: 100%;
      height: 100%;
    }

    /* Detail / Summary Panel */
    #detail-panel {
      width: 380px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 16px;
      overflow-y: auto;
      transition: transform 0.3s ease;
      position: relative;
      z-index: 5;
    }

    .panel-header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .node-type-badge {
      display: inline-block;
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .badge-topic { background: rgba(56, 189, 248, 0.2); color: var(--accent-blue); }
    .badge-subtopic { background: rgba(192, 132, 252, 0.2); color: var(--accent-purple); }

    .node-title {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .source-ref {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .summary-text {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #cbd5e1;
    }

    /* Analogy Image Section */
    .image-container {
      margin-top: auto;
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      background: var(--bg-card);
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-blue), #2563eb);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.9; }

    .analogy-img {
      width: 100%;
      border-radius: 6px;
      margin-top: 10px;
      display: none;
    }

    /* Drop Overlay */
    #drop-zone {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 15, 25, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px dashed var(--accent-blue);
      z-index: 20;
    }

    #drop-zone.hidden { display: none; }

    .drop-text {
      font-size: 1.2rem;
      color: var(--text-main);
      margin-top: 12px;
    }

    /* Loader */
    .loader {
      border: 3px solid var(--border-color);
      border-top: 3px solid var(--accent-blue);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      display: none;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* D3 SVG Elements */
    .node { cursor: pointer; }
    .node circle { transition: r 0.2s, stroke 0.2s; }
    .node:hover circle { stroke: #fff; stroke-width: 3px; }
    .link { stroke: #475569; stroke-opacity: 0.6; stroke-width: 1.5px; }
    .link-label { font-size: 10px; fill: var(--text-muted); text-anchor: middle; }
    .node-text { font-size: 12px; fill: var(--text-main); pointer-events: none; }
  </style>
</head>
<body>

  <header>
    <div class="brand">demo mind sucker shit</div>
    <div class="api-config">
      <input type="password" id="api-key" placeholder="Paste OpenAI Key (In-Memory Only)" />
      <input type="file" id="file-input" accept="application/pdf" style="display: none;" />
      <button class="btn" onclick="document.getElementById('file-input').click()">Upload PDF</button>
    </div>
  </header>

  <div class="app-container">
    <!-- Drag and Drop Overlay -->
    <div id="drop-zone">
      <div class="loader" id="loading-spinner"></div>
      <p class="drop-text" id="drop-status">Drag & Drop PDF document here to generate knowledge graph</p>
    </div>

    <!-- Main Graph Viewport -->
    <div id="graph-container">
      <svg id="graph-svg"></svg>
    </div>

    <!-- Right Side Detail / Summary Panel -->
    <div id="detail-panel">
      <div class="panel-header">
        <span class="node-type-badge badge-topic" id="panel-badge">Topic</span>
        <h2 class="node-title" id="panel-title">Select a Node</h2>
        <div class="source-ref" id="panel-source">Click any node in the graph to inspect theory & summaries</div>
      </div>

      <div class="summary-text" id="panel-summary">
        Upload a document to extract structured entities, hierarchies, and cross-relationships into an interactive knowledge map.
      </div>

      <div class="image-container">
        <button class="btn" id="generate-img-btn" onclick="triggerAnalogyImage()" disabled>Generate Analogy Image</button>
        <div class="loader" id="img-loader" style="margin: 10px auto;"></div>
        <img id="analogy-img" class="analogy-img" alt="Analogy visualization" />
      </div>
    </div>
  </div>

  <script>
    // Set PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Strictly In-Memory Application State (No local/session storage)
    let appState = {
      apiKey: "",
      document: null,
      nodes: [],
      edges: [],
      selectedNode: null
    };

    // UI Elements
    const dropZone = document.getElementById('drop-zone');
    const dropStatus = document.getElementById('drop-status');
    const spinner = document.getElementById('loading-spinner');
    const apiKeyInput = document.getElementById('api-key');

    // Keep API key strictly in JS memory
    apiKeyInput.addEventListener('input', (e) => {
      appState.apiKey = e.target.value.trim();
    });

    // Drag and Drop Handling
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length > 0 && e.dataTransfer.files[0].type === 'application/pdf') {
        handlePdfUpload(e.dataTransfer.files[0]);
      }
    });

    document.getElementById('file-input').addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handlePdfUpload(e.target.files[0]);
      }
    });

    // PDF Ingestion & Text Parsing
    async function handlePdfUpload(file) {
      dropZone.classList.remove('hidden');
      spinner.style.display = 'block';
      dropStatus.innerText = "Extracting text with PDF.js...";

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = "";

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          const pageText = textContent.items.map(item => item.str).join(' ');
          fullText += `\n--- Page ${i} ---\n` + pageText;
        }

        dropStatus.innerText = appState.apiKey ? "Extracting Topics & Graph Relationships (AI Call)..." : "Building Graph (Demo Mode)...";
        
        // Topic / Relation Extraction
        const graphData = await extractKnowledgeGraph(fullText, file.name, pdf.numPages);
        
        appState.document = graphData.document;
        appState.nodes = graphData.nodes;
        appState.edges = graphData.edges;

        // Render Step
        dropZone.classList.add('hidden');
        renderGraph(appState.nodes, appState.edges);

      } catch (err) {
        console.error(err);
        dropStatus.innerText = "Error parsing PDF: " + err.message;
        spinner.style.display = 'none';
      }
    }

    // AI Extraction Routine with Fallback Mock Generator if API Key is missing
    async function extractKnowledgeGraph(rawText, filename, pageCount) {
      if (appState.apiKey) {
        try {
          const prompt = `Analyze the following extracted text from a PDF document. Build a structured knowledge graph in JSON output.
Return JSON ONLY matching this structure:
{
  "nodes": [
    {"id": "1", "label": "Main Topic Title", "type": "topic", "summary": "Plain language summary of the concept", "sourceRef": "pp. 1-2"},
    {"id": "2", "label": "Sub concept Title", "type": "subtopic", "summary": "Subtopic details...", "sourceRef": "p. 3"}
  ],
  "edges": [
    {"source": "1", "target": "2", "type": "hierarchy", "label": "part of"},
    {"source": "2", "target": "3", "type": "relates_to", "label": "feeds into"}
  ]
}

Text sample:
${rawText.slice(0, 7000)}`;

          const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${appState.apiKey}`
            },
            body: JSON.stringify({
              model: "gpt-4o-mini",
              messages: [{ role: "user", content: prompt }],
              response_format: { type: "json_object" }
            })
          });

          const resData = await response.json();
          const parsed = JSON.parse(resData.choices[0].message.content);
          return {
            document: { title: filename, pageCount },
            nodes: parsed.nodes,
            edges: parsed.edges
          };
        } catch (e) {
          console.warn("AI API request failed, falling back to local extractor.", e);
        }
      }

      // Fallback Engine (Demo Mode) when no API Key is provided
      return generateMockGraphFromText(filename, pageCount);
    }

    // Heuristic Fallback Knowledge Graph Generator
    function generateMockGraphFromText(filename, pageCount) {
      const nodes = [
        { id: "1", label: filename.replace('.pdf',''), type: "topic", summary: "Primary subject extracted from uploaded document.", sourceRef: `pp. 1-${pageCount}` },
        { id: "2", label: "Core Theoretical Principles", type: "subtopic", summary: "Fundamental concepts and structural building blocks defined across early sections.", sourceRef: "p. 1" },
        { id: "3", label: "Data Flow & Execution", type: "subtopic", summary: "Architectural pipeline outlining sequential text extraction and processing.", sourceRef: "p. 2" },
        { id: "4", label: "Client-Side Processing", type: "subtopic", summary: "In-memory state execution strictly maintaining zero data retention.", sourceRef: "p. 3" },
        { id: "5", label: "Graph Render Engine", type: "subtopic", summary: "Interactive visual entity relationship mapping.", sourceRef: "p. 4" }
      ];

      const edges = [
        { source: "1", target: "2", type: "hierarchy", label: "defines" },
        { source: "1", target: "3", type: "hierarchy", label: "contains" },
        { source: "2", target: "4", type: "relates_to", label: "enforces" },
        { source: "3", target: "5", type: "relates_to", label: "renders" }
      ];

      return { document: { title: filename, pageCount }, nodes, edges };
    }

    // D3.js Force-Directed Graph Rendering
    function renderGraph(nodes, links) {
      const svg = d3.select("#graph-svg");
      svg.selectAll("*").remove();

      const width = document.getElementById('graph-container').clientWidth;
      const height = document.getElementById('graph-container').clientHeight;

      const g = svg.append("g");

      // Zoom & Pan support
      svg.call(d3.zoom().scaleExtent([0.2, 4]).on("zoom", (e) => g.attr("transform", e.transform)));

      // Force Simulation Setup
      const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(140))
        .force("charge", d3.forceManyBody().strength(-400))
        .force("center", d3.forceCenter(width / 2, height / 2));

      // Edges (Links)
      const link = g.append("g")
        .selectAll("line")
        .data(links)
        .enter().append("line")
        .attr("class", "link")
        .attr("stroke-dasharray", d => d.type === 'relates_to' ? "4,4" : "0");

      // Node Groups
      const node = g.append("g")
        .selectAll(".node")
        .data(nodes)
        .enter().append("g")
        .attr("class", "node")
        .call(d3.drag()
          .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
          .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
          .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
        )
        .on("click", (e, d) => selectNode(d));

      // Node Circles
      node.append("circle")
        .attr("r", d => d.type === 'topic' ? 14 : 9)
        .attr("fill", d => d.type === 'topic' ? "#38bdf8" : "#c084fc");

      // Node Labels
      node.append("text")
        .attr("class", "node-text")
        .attr("dx", 18)
        .attr("dy", 4)
        .text(d => d.label);

      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

        node.attr("transform", d => `translate(${d.x},${d.y})`);
      });
    }

    // Node Selection & Summary Panel Updates
    function selectNode(node) {
      appState.selectedNode = node;
      
      document.getElementById('panel-title').innerText = node.label;
      document.getElementById('panel-summary').innerText = node.summary;
      document.getElementById('panel-source').innerText = `Source Reference: ${node.sourceRef || 'N/A'}`;
      
      const badge = document.getElementById('panel-badge');
      badge.innerText = node.type;
      badge.className = `node-type-badge ${node.type === 'topic' ? 'badge-topic' : 'badge-subtopic'}`;

      const imgBtn = document.getElementById('generate-img-btn');
      imgBtn.disabled = false;

      const analogyImg = document.getElementById('analogy-img');
      if (node.imageUrl) {
        analogyImg.src = node.imageUrl;
        analogyImg.style.display = 'block';
      } else {
        analogyImg.style.display = 'none';
      }
    }

    // Optional Analogy Image Generation
    async function triggerAnalogyImage() {
      if (!appState.selectedNode) return;

      const imgLoader = document.getElementById('img-loader');
      const imgBtn = document.getElementById('generate-img-btn');
      const analogyImg = document.getElementById('analogy-img');

      imgLoader.style.display = 'block';
      imgBtn.disabled = true;

      const node = appState.selectedNode;

      try {
        if (appState.apiKey) {
          const response = await fetch('https://api.openai.com/v1/images/generations', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${appState.apiKey}`
            },
            body: JSON.stringify({
              prompt: `A visual metaphorical analogy representing: ${node.label} - ${node.summary}`,
              n: 1,
              size: "256x256"
            })
          });
          const data = await response.json();
          node.imageUrl = data.data[0].url;
        } else {
          node.imageUrl = `https://picsum.photos/seed/${encodeURIComponent(node.label)}/300/200`;
        }

        analogyImg.src = node.imageUrl;
        analogyImg.style.display = 'block';
      } catch (err) {
        alert("Failed to generate image: " + err.message);
      } finally {
        imgLoader.style.display = 'none';
        imgBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
